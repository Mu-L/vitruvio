name: protecode-blackduck

on:
  workflow_dispatch:
#  schedule:
#    - cron: "0 4 * * 1" # Mondays at 03:00 UTC

jobs:
  build:
    name: Build dev package for protecode
    uses: ./.github/workflows/generic-base.yml
    with:
      build_profile: vitruvio_host_package
      config: Development
      lane: ce4ue

  upload:
    name: Upload dev build to protecode
    needs: build
    runs-on: [self-hosted, zrh-unreal]
    concurrency:
      group: protecode-upload-${{ vars.BLACKDUCK_GROUP_ID }}-${{ vars.BLACKDUCK_APPLICATION_NAME }}
      cancel-in-progress: false

    env:
      BLACKDUCK_BASE_URL: ${{ vars.BLACKDUCK_BASE_URL }}
      BLACKDUCK_API_KEY: ${{ secrets.BLACKDUCK_API_KEY }}

      BLACKDUCK_GROUP_ID: ${{ vars.BLACKDUCK_GROUP_ID }}
      BLACKDUCK_APPLICATION_NAME: ${{ vars.BLACKDUCK_APPLICATION_NAME }}

      BLACKDUCK_FILE_PATH: ${{ needs.build.outputs.build_archive_path }}

    steps:
      - name: Upload Black Duck artifact
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:BLACKDUCK_BASE_URL)) {
            throw "Missing required environment variable BLACKDUCK_BASE_URL"
          }

          if ([string]::IsNullOrWhiteSpace($env:BLACKDUCK_API_KEY)) {
            throw "Missing required secret BLACKDUCK_API_KEY"
          }

          if ([string]::IsNullOrWhiteSpace($env:BLACKDUCK_GROUP_ID)) {
            throw "Missing required environment variable BLACKDUCK_GROUP_ID"
          }

          if ([string]::IsNullOrWhiteSpace($env:BLACKDUCK_APPLICATION_NAME)) {
            throw "Missing required environment variable BLACKDUCK_APPLICATION_NAME"
          }

          if ($env:BLACKDUCK_APPLICATION_NAME -notmatch '^[a-zA-Z0-9 _\.\=\(\)\-]+$') {
            throw "BLACKDUCK_APPLICATION_NAME contains unsupported characters"
          }

          if ([string]::IsNullOrWhiteSpace($env:BLACKDUCK_FILE_PATH)) {
            throw "Missing required build output build_archive_path"
          }

          if (-not (Test-Path -LiteralPath $env:BLACKDUCK_FILE_PATH)) {
            throw "Artifact not found: $env:BLACKDUCK_FILE_PATH"
          }
            
          $fileName = $env:BLACKDUCK_APPLICATION_NAME
          $encodedFileName = [System.Uri]::EscapeDataString($fileName)
          $baseUrl = $env:BLACKDUCK_BASE_URL.TrimEnd('/')
          $uploadUrl = '{0}/api/upload/{1}' -f $baseUrl, $encodedFileName

          $headers = @{
            Authorization = "Bearer $env:BLACKDUCK_API_KEY"
            Group = $env:BLACKDUCK_GROUP_ID
          }

          $encodedGroupId = [System.Uri]::EscapeDataString($env:BLACKDUCK_GROUP_ID)
          $lookupUrl = '{0}/api/apps/{1}/?name={2}' -f $baseUrl, $encodedGroupId, $encodedFileName
          $lookup = Invoke-RestMethod -Method Get -Uri $lookupUrl -Headers $headers -ErrorAction Stop

          if ($lookup.meta.code -ne 200 -or $null -eq $lookup.count -or $null -eq $lookup.products) {
            throw 'Application lookup returned an unexpected response; refusing to upload'
          }

          if ($lookup.count -gt 1 -or $lookup.next) {
            throw "Multiple applications named '$fileName' exist in group $env:BLACKDUCK_GROUP_ID. Rename or remove duplicate entries before retrying."
          }

          $products = @($lookup.products)
          if ($lookup.count -ne $products.Count) {
            throw 'Application lookup returned an inconsistent count; refusing to upload'
          }

          if ($products.Count -eq 1) {
            $product = $products[0]
            if ($product.name -cne $fileName -or [string]$product.group_id -ne $env:BLACKDUCK_GROUP_ID -or [string]$product.product_id -notmatch '^[1-9][0-9]*$') {
              throw 'Application lookup did not return the expected name, group, and product ID; refusing to replace'
            }

            $headers['Replace'] = [string]$product.product_id
            Write-Host "Replacing product $($product.product_id): $fileName"
          } else {
            Write-Host "Creating application in group $env:BLACKDUCK_GROUP_ID`: $fileName"
          }

          $request = @{
            Method = 'Put'
            Uri = $uploadUrl
            Headers = $headers
            InFile = $env:BLACKDUCK_FILE_PATH
            ContentType = 'application/octet-stream'
            ErrorAction = 'Stop'
          }

          $response = Invoke-RestMethod @request

          if ($response.meta.code -ne 200 -or [string]$response.results.product_id -notmatch '^[1-9][0-9]*$') {
            throw 'Upload did not return a successful response with a product ID'
          }

          if ($headers.ContainsKey('Replace') -and [string]$response.results.product_id -ne $headers['Replace']) {
            throw 'Upload returned a different product ID than the replacement target'
          }

          $response | ConvertTo-Json -Depth 20
